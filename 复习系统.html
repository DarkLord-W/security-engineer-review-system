<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息安全工程师复习系统</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8f0; --tx:#1c2333; --tx2:#5b6478;
  --pri:#2456e6; --pri2:#eaf0ff; --ok:#0e9f5b; --okbg:#e5f7ee; --ng:#e0344a; --ngbg:#fdecee;
  --warn:#c77c11; --warnbg:#fdf3e2; --r:12px; --gold:#b8860b; --page-max:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.65}
header{background:var(--card);border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:2px;height:52px;overflow-x:auto}
.logo{font-weight:700;color:var(--pri);margin-right:8px;white-space:nowrap;font-size:16px}
.tab{border:none;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--tx2);font-size:14.5px;white-space:nowrap}
.tab.on{background:var(--pri2);color:var(--pri);font-weight:600}
main{max-width:var(--page-max);margin:18px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:12px}
h3{font-size:15px;margin:10px 0 6px}
.muted{color:var(--tx2);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.stat{flex:1;min-width:100px;background:var(--pri2);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--tx2)}
.stat.g b{color:var(--ok)} .stat.g{background:var(--okbg)}
.stat.o b{color:var(--warn)} .stat.o{background:var(--warnbg)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:9px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ng{background:var(--ng);border-color:var(--ng);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=password],input[type=number],textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--tx)}
textarea{width:100%;min-height:90px;resize:vertical;font-family:inherit;line-height:1.6}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:5px;transition:width .25s}
.pcard{cursor:pointer;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 3px 14px rgba(30,60,150,.12)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;margin-right:6px;vertical-align:1px}
.tag.s1{background:var(--pri2);color:var(--pri)}
.tag.s2{background:#f0eafc;color:#7048c9}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.ng{background:var(--ngbg);color:var(--ng)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.gray{background:#eef1f6;color:var(--tx2)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer;font-size:14.5px;line-height:1.5}
.opt:hover{border-color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.opt.disabled{cursor:default;opacity:.92}
.ana{background:#f8f9fc;border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
.ana pre{white-space:pre-wrap;word-break:break-word;font-family:inherit}
.qtext{font-size:15.5px;margin:6px 0 4px;white-space:pre-wrap;word-break:break-word}
.qtext img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:zoom-in}
.qtext table{border-collapse:collapse;margin:8px 0;font-size:13.5px;display:block;overflow-x:auto;max-width:100%;white-space:normal}
.qtext table td,.qtext table th{border:1px solid var(--line);padding:5px 8px}
.qtext table th{background:#eef2fa}
.qtext pre{white-space:pre-wrap;font-family:Consolas,"Courier New",monospace;background:#f6f8fa;border:1px solid #e3e6ec;padding:10px;border-radius:8px;overflow-x:auto;line-height:1.55;font-size:13.5px;margin:8px 0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.case{border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fafbfe;white-space:pre-wrap;word-break:break-word}
.subq{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.subq .hd{font-weight:600;color:var(--pri);margin-bottom:4px}
.reveal{background:#f8f9fc;border-radius:8px;padding:10px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.reveal.ans{background:var(--pri2);border-left:5px solid var(--pri)}
.reveal.ana2{background:var(--warnbg);border-left:5px solid var(--warn)}
.airesult{white-space:pre-wrap}
.markbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.markbtns .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.tb th{color:var(--tx2);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;padding-top:6px;padding-bottom:22px}
.bars .b{flex:1;background:var(--pri2);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.bars .b i{position:absolute;bottom:0;left:0;right:0;background:var(--pri);border-radius:4px 4px 0 0}
.bars .b span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--tx2)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 20px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:80vw}
.toast.show{opacity:.92}
#errbox{display:none;background:var(--ngbg);color:var(--ng);padding:8px 12px;border-radius:8px;margin:10px auto;max-width:var(--page-max);font-size:12px;white-space:pre-wrap}
.wrongs-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:9px 2px}
.wrongs-item:last-child{border-bottom:none}
/* 翻卡 */
.flipwrap{perspective:1200px;min-height:200px}
.flip{background:var(--pri2);border:2px solid var(--pri);border-radius:14px;padding:26px 22px;min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.flip .front{font-size:19px;font-weight:700;text-align:center}
.flip .secinfo{text-align:center;color:var(--tx2);font-size:12.5px;margin-top:10px}
.flip .back{font-size:14.5px;text-align:left}
.flip pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;margin:0}
.gradebtns{display:flex;gap:8px;margin-top:14px}
.gradebtns .btn{flex:1;padding:10px 4px}
.g0{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.g1{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.g2{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.g3{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.chbar{display:flex;align-items:center;gap:8px;margin:5px 0}
.chbar .nm{width:210px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chbar .bar{flex:1}
.chbar .pc{width:70px;text-align:right;font-size:12px;color:var(--tx2)}
.timer{position:sticky;top:52px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.timer b{font-size:20px;color:var(--pri);font-variant-numeric:tabular-nums}
.airesult{background:#f0f7ff;border:1px solid #cfe3ff;border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
.airesult .sc{font-size:22px;font-weight:700;color:var(--pri)}
.airesult ul{margin:6px 0 0 18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--pri);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.heat{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.heat i{width:14px;height:14px;border-radius:3px;background:#eef1f6}
.heat i.h1{background:#bcd4ff}.heat i.h2{background:#7aa7f7}.heat i.h3{background:var(--pri)}
details summary{cursor:pointer;color:var(--pri);font-size:13.5px;margin:6px 0}
.tag.t0{background:var(--ngbg);color:var(--ng);font-weight:600}
.tag.t1{background:var(--warnbg);color:var(--warn);font-weight:600}
.tag.t2{background:#eef1f6;color:var(--tx2)}
.pday{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:9px 4px}
.pday:last-child{border-bottom:none}
.pday .dt{width:112px;flex:none;color:var(--tx2);font-size:13px;line-height:1.5}
.pday.today{background:var(--pri2);border-radius:8px}
.pday.today .dt{color:var(--pri);font-weight:700}
.pday.overdue .dt{color:var(--ng);font-weight:600}
.pday.overdue-todo .dt{color:var(--warn);font-weight:600}
.pbadge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;margin-left:4px}
.pbadge.done{background:var(--okbg);color:var(--ok)}
.pbadge.part{background:var(--warnbg);color:var(--warn)}
.pbadge.todo{background:var(--pri2);color:var(--pri)}
.pbadge.none{background:#eef1f6;color:var(--tx2)}
.dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#dfe5f0}
.dot.ok{background:var(--ok)}
.dot.mid{background:var(--warn)}
.dot.no{background:var(--ng)}
.dot.ans{background:var(--pri)}
.pdayprog{font-size:11px;color:var(--tx2)}
.pdayprog.full{color:var(--ok);font-weight:700}
.planlegend{font-size:12px;color:var(--tx2);margin-top:6px}
.planlegend .dot{margin:0 2px}
.pcase{cursor:pointer;margin-right:10px;white-space:nowrap}
.pcase:hover{color:var(--pri);text-decoration:underline}
.phase-hd{margin:14px 0 4px;font-weight:700;font-size:14.5px}
.figbox{margin:8px 0;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fbfcff}
.figbox img{max-width:100%;display:block;border-radius:6px}
.figbox figcaption{font-size:12.5px;color:var(--tx2);text-align:center;margin-top:4px}
.fig-inline{margin:6px 0 2px}
.tag.s3{background:#fdf3e2;color:#b8860b;font-weight:600}
.hb-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.hb-item.cked{background:var(--okbg);border-color:var(--ok)}
.ckbtn{border:none;background:none;font-size:18px;cursor:pointer;color:var(--pri);padding:0 4px;vertical-align:-2px}
.hb-item .hb-q{font-size:15px}
.hb-item .hb-a{background:var(--pri2);border-left:5px solid var(--pri);border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.casebg{margin:8px 0}
.casebg summary{cursor:pointer;color:var(--pri);font-size:13.5px}
.figblock{margin:8px 0;padding:8px;border:1px dashed var(--line);border-radius:8px;background:#fbfcff}
.figblock img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:4px 0;cursor:zoom-in}
.figblock table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;max-width:100%;white-space:normal}
.figblock td,.figblock th{border:1px solid var(--line);padding:4px 7px}
.figblock th{background:#eef2fa}
.modal-mask{position:fixed;inset:0;background:rgba(20,30,60,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px}
.modal-box{background:#fff;border-radius:12px;max-width:min(96vw,var(--page-max));width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-body{overflow:auto;padding:12px 16px}
.modal-body h3{margin:14px 0 6px}
#printArea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:var(--page-max);margin:12px auto}
#printArea h1{font-size:24px;border-bottom:3px solid var(--pri);padding-bottom:8px;margin:0 0 6px}
#printArea h2{font-size:19px;border-left:6px solid var(--pri);padding-left:10px;margin:26px 0 10px}
#printArea h3{font-size:15.5px;margin:16px 0 8px}
#printArea table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
#printArea th,#printArea td{border:1px solid #9aa3b2;padding:5px 8px;vertical-align:top}
#printArea th{background:#eef2fa}
#printArea td.q{width:42%;background:#fafbfe}
#printArea td.ck{width:28px;text-align:center;color:#999;font-size:15px}
#printArea .pr-card{border:1px solid #b9c0cc;border-radius:8px;padding:12px 14px;margin:12px 0}
#printArea pre{background:#f6f8fa;border:1px solid #ddd;padding:8px 10px;white-space:pre-wrap;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.55}
#printArea .muted{color:#666;font-size:12.5px}
.hb-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
.hb-table th,.hb-table td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
.hb-table th{background:#eef2fa;text-align:left}
.hb-table td.q{width:42%;background:#fafbfe}
.hb-table td.ck{width:36px;text-align:center}
.hb-table tr.cked td{background:var(--okbg)}
.hb-table.hide-ans td.ans{color:transparent;background:#f2f4f8}
.hb-table tr.revealed td.ans{color:inherit;background:inherit}
.hb-table tbody tr:hover td{background:#f5f8ff}
@media print{
  header,#errbox,.toast,.noprint,nav{display:none !important}
  main{max-width:none;margin:0;padding:0}
  .card{border:none;padding:0;margin:0}
  #printArea h2{page-break-before:always}
  #printArea h2:first-of-type{page-break-before:auto}
  #printArea h3{page-break-after:avoid}
  #printArea tr{page-break-inside:avoid}
  #printArea table{border-collapse:collapse;width:100%;font-size:12px}
  #printArea th,#printArea td{border:1px solid #666;padding:4px 6px;vertical-align:top}
  #printArea img{max-width:100%}
}
</style>
</head>
<body>
<header>
  <span class="logo">🔒 信安复习</span>
  <button class="tab on" data-v="home">首页</button>
  <button class="tab" data-v="plan">计划</button>
  <button class="tab" data-v="sprint">冲刺</button>
  <button class="tab" data-v="am">上午场</button>
  <button class="tab" data-v="pm">下午场</button>
  <button class="tab" data-v="know">知识点</button>
  <button class="tab" data-v="wrong">错题本</button>
  <button class="tab" data-v="stats">统计</button>
  <button class="tab" data-v="settings">设置</button>
</header>
<div id="errbox"></div>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script src="data/questions.js"></script>
<script src="data/syllabus.js"></script>
<script>window.AI_CONTENT = window.AI_CONTENT || {};</script>
<script src="data/ai_content.js" onerror="this.remove()"></script>
<script src="data/cards.js"></script>
<script src="data/plan.js"></script>
<script>window.SE_KEYS = window.SE_KEYS || {};</script>
<script src="data/keys.js" onerror="this.remove()"></script>
<script>window.FIGS = window.FIGS || {};</script>
<script src="data/figs.js" onerror="this.remove()"></script>
<script>window.HANDBOOK = window.HANDBOOK || {};</script>
<script src="data/handbook.js" onerror="this.remove()"></script>
<script>window.EXPLAIN = window.EXPLAIN || {};</script>
<script src="data/explain.js" onerror="this.remove()"></script>
<script>
'use strict';
var APP_VER = 'v1.9';
console.log('信息安全工程师复习系统 ' + APP_VER);
window.onerror = function(m, s, l){ var e=document.getElementById('errbox'); e.style.display='block'; e.textContent += m+' @'+l+'\n'; };

/* ================= 存储层 ================= */
var LS_KEY='se_progress_v2', LS_IMP='se_import_v1', LS_SET='se_settings_v2', LS_SNAP='se_snapshot_v1';
var KEYS = window.SE_KEYS || {};
function defaultSettings(){ return {dsKey:'', glmKey:'', dsModel:'deepseek-chat', glmModel:'glm-4.7-flash', provider:'deepseek', newPerDay:20, kScope:'all', qMode:'quiz', examDate:'2026-10-24', pageWidth:1200, wrongN:20, wrongOrder:'random', wrongMaster:2, planMode:'auto', planRedo:true}; }
function defaultStore(){ return {version:2, rec:{}, caseRec:{}, srs:{}, daily:{}, aiCache:{}, exams:[], hb:{}, hbCalc:{}, explain:{}, settings:defaultSettings()}; }
function settingsFromFile(){
  var s = {};
  if(KEYS.dsKey) s.dsKey = KEYS.dsKey;
  if(KEYS.glmKey) s.glmKey = KEYS.glmKey;
  if(KEYS.dsModel) s.dsModel = KEYS.dsModel;
  if(KEYS.glmModel) s.glmModel = KEYS.glmModel;
  if(KEYS.provider) s.provider = KEYS.provider;
  return s;
}
function mergeSettings(stored){
  var s = defaultSettings();
  var f = settingsFromFile();
  for(var k in f) s[k] = f[k];
  if(stored){
    if(!stored.dsKey && stored.deepseekKey) stored.dsKey = stored.deepseekKey;
    if(!stored.dsModel && stored.deepseekModel) stored.dsModel = stored.deepseekModel;
    for(var k2 in stored){
      if(k2==='deepseekKey' || k2==='deepseekModel') continue;
      var v = stored[k2]; if(v!==undefined && v!==null && v!=='') s[k2] = v;
    }
  }
  return s;
}
function readStoredSettings(){
  try{ var s = JSON.parse(localStorage.getItem(LS_SET)); if(s && typeof s==='object') return s; }catch(e){}
  try{ var d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && d.settings && typeof d.settings==='object') return d.settings; }catch(e){}
  return null;
}
var store = load();
function load(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  var def = defaultStore();
  var out = (d && d.rec)? d : def;
  for(var k in def) if(out[k]===undefined) out[k]=def[k];
  out.settings = mergeSettings(readStoredSettings());
  return out;
}
function save(){
  try{
    var copy = {};
    for(var k in store) if(k!=='settings') copy[k]=store[k];
    localStorage.setItem(LS_KEY, JSON.stringify(copy));
    scheduleBackup();
    return true;
  }catch(e){ toast('存储失败: '+(e.message||e)); return false; }
}
function saveSettings(){
  try{
    var json = JSON.stringify(store.settings);
    localStorage.setItem(LS_SET, json);
    scheduleBackup();
    return localStorage.getItem(LS_SET)===json;
  }catch(e){ return false; }
}

/* ================= 自动备份到文件 (File System Access API) ================= */
var backupHandle = null, backupTimer = null, backupStatus = '';
function idbOpen(){
  return new Promise(function(res, rej){
    var r = indexedDB.open('se_fs', 1);
    r.onupgradeneeded = function(){ try{ r.result.createObjectStore('h'); }catch(e){} };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbSet(k, v){
  return idbOpen().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction('h','readwrite'); tx.objectStore('h').put(v, k);
    tx.oncomplete = function(){ res(true); }; tx.onerror = function(){ rej(tx.error); };
  }); });
}
function idbGet(k){
  return idbOpen().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction('h','readonly'); var rq = tx.objectStore('h').get(k);
    rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ rej(rq.error); };
  }); });
}
function backupSupported(){ return !!(window.showSaveFilePicker && window.indexedDB); }
function chooseBackupFile(){
  if(!backupSupported()){ toast('当前浏览器不支持自动备份，请用"导出全部进度"'); return; }
  window.showSaveFilePicker({suggestedName:'复习进度备份.json', types:[{description:'JSON 备份', accept:{'application/json':['.json']}}]})
    .then(function(h){ backupHandle = h; return idbSet('backup', h); })
    .then(function(){ return writeBackup(true); })

function writeBackup(force){
  if(!backupHandle) return Promise.resolve(false);
  return Promise.resolve()
    .then(function(){ return backupHandle.queryPermission({mode:'readwrite'}); })
    .then(function(p){
      if(p!=='granted' && force) return backupHandle.requestPermission({mode:'readwrite'});
      return p;
    })
    .then(function(p){
      if(p!=='granted'){ backupStatus='需授权'; return false; }
      return backupHandle.createWritable().then(function(w){
        return w.write(JSON.stringify(store)).then(function(){ return w.close(); });
      }).then(function(){
        backupStatus = '已备份 '+new Date().toLocaleTimeString();
        store.settings.lastBackupTs = Date.now();
        try{ localStorage.setItem(LS_SET, JSON.stringify(store.settings)); }catch(e){}
        return true;
      });
    })
    .catch(function(){ backupStatus='失败'; return false; });
}

  var parts = s.split(/(<pre[\s\S]*?<\/pre>|<table[\s\S]*?<\/table>|<img[^>]*>|<details[\s\S]*?<\/details>)/i);
  for(var i=0;i<parts.length;i++){
    if(i % 2 === 1) continue; // 保护块
    var t = parts[i];
    if(!t) continue;
    var subN = (t.match(/[（(]\s*\d{1,2}\s*[）)]/g)||[]).length;
    var optN = (t.match(/[\s\u3000][A-D]\s*[.、．]\s*\S/g)||[]).length;
    if(subN >= 3 || optN >= 2){
      t = t.replace(/\s*([（(]\s*\d{1,2}\s*[）)])/g, '\n$1');
      t = t.replace(/[\s\u3000]+([A-D])\s*[.、．]\s*/g, '\n　　$1. ');
      t = t.replace(/\n{3,}/g, '\n\n').replace(/^\n+/, '');
    }
    parts[i] = t;
  }
  return parts.join('');
}

function fetchT(url, opts, ms){

function classifyErr(e){
  if(e && (e.name==='AbortError' || e.code===20)) return '请求超时(25秒)';
  if(e && e.status === 401) return 'Key无效或未授权(401)';
  if(e && e.status === 402) return '余额不足(402)';

function httpErr(resp){

}
function llmChat(messages, useJson){
  var ps = llmProviders();
  if(!ps.length) return Promise.reject({msg:'未配置 API Key，请在设置中填写并保存', status:0});
  var i = 0;
  function tryNext(){
    if(i>=ps.length) return Promise.reject({msg:'所有 API 调用失败（已尝试: '+ps.map(function(p){return p.name+'/'+p.model;}).join(', ')+'）', status:0});
    var p = ps[i++];
    var body = {model:p.model, messages:messages, temperature:0.3, max_tokens:2000, stream:false};
    if(useJson && p.code==='deepseek') body.response_format = {type:'json_object'};
    return fetchT(p.url, {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+p.key}, body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) return httpErr(r); return r.json(); })
      .then(function(j){
        var m = j.choices&&j.choices[0]&&j.choices[0].message;
        var txt = (m&&(m.content||m.reasoning_content))||'';
        if(!txt) throw {status:j.error?0:1, detail:JSON.stringify(j).slice(0,100), message:'空响应'};
        return txt;
      })
      .catch(function(e){ console.warn(p.name, e); return tryNext().catch(function(e2){ throw lastOrFirst(e,e2); }); });
  }
  function lastOrFirst(a,b){ return a&&a.status? a : (b&&b.status? b : a); }
  return tryNext();
}

/* ================= 冲刺计划 ================= */
function dayNum(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]).getTime(); }
function isBeforeToday(s){ var t = new Date(); return dayNum(s) < new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime(); }
function dateAdd(s, n){
  var p = String(s).split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function fmtMD(s){ var p = String(s).split('-'); return (+p[1])+'/'+(+p[2]); }
function planModeVal(){ return (store.settings||{}).planMode || 'auto'; }
function planRedoVal(){ var v = (store.settings||{}).planRedo; return v===undefined? true : !!v; }
function setPlanMode(m){ store.settings.planMode = m; saveSettings(); vPlan(); }
function setPlanRedo(v){ store.settings.planRedo = !!v; saveSettings(); vPlan(); }
function dynPlan(){
  var t = today();
  var exam = examDateStr();
  var examNum = dayNum(exam), tNum = dayNum(t);
  var res = {ended:false, days:[], firstPass:[], unscheduled:[], overdueN:0, perDay:0, remainDays:Math.max(0, Math.round((examNum-tNum)/86400000)), redoN:0, redoOn:planRedoVal(), exam:exam};
  if(tNum > dayNum(dateAdd(exam,3))){ res.ended = true; return res; }
  var mock1 = dateAdd(exam,-13), mock2 = dateAdd(exam,-6), mock3 = dateAdd(exam,-3);
  var lastCase = dateAdd(exam,-7);
  var sprintA = dateAdd(exam,-5), sprintB = dateAdd(exam,-4);
  var finalA = dateAdd(exam,-2), finalB = dateAdd(exam,-1);
  var seen = {}, firstPass = [];
  PLAN.schedule.forEach(function(d){
    (d.cases||[]).forEach(function(cid){
      if(seen[cid]) return; seen[cid]=1;
      if(caseState(cid).state!=='done') firstPass.push(cid);
    });
  });
  res.firstPass = firstPass;
  var seen2 = {}, over = 0;
  PLAN.schedule.forEach(function(d){
    if(!isBeforeToday(d.date)) return;
    (d.cases||[]).forEach(function(cid){
      if(seen2[cid]) return; seen2[cid]=1;
      if(caseState(cid).state!=='done') over++;
    });
  });
  res.overdueN = over;
  var redo = [], rseen = {};
  PLAN.schedule.forEach(function(d){
    if(!/二刷|默写20/.test(d.task||'')) return;
    (d.cases||[]).forEach(function(cid){
      if(rseen[cid]) return; rseen[cid]=1;
      if(caseState(cid).state==='done') redo.push(cid);
    });
  });
  res.redoN = redo.length;
  var days = [], cur = t;
  while(dayNum(cur) <= dayNum(lastCase)){ if(cur!==mock1) days.push(cur); cur = dateAdd(cur,1); }
  var assign = {}; days.forEach(function(dd){ assign[dd] = []; });
  var left = firstPass.slice();
  for(var i=0;i<days.length && left.length;i++){
    var n = Math.ceil(left.length / (days.length - i));
    assign[days[i]] = left.splice(0, n);
  }
  res.unscheduled = left;
  res.perDay = days.length? Math.ceil(firstPass.length/days.length) : firstPass.length;
  var redoAssign = {};
  if(res.redoOn && redo.length){
    var r1 = Math.ceil(redo.length/2);
    redoAssign[sprintA] = redo.slice(0, r1);
    redoAssign[sprintB] = redo.slice(r1);
  }
  var out = [], dd = t;
  while(dayNum(dd) <= dayNum(dateAdd(exam,3))){
    var e = null;
    if(assign[dd]) e = {date:dd, kind:'study', cases:assign[dd]};
    else if(dd===mock1) e = {date:dd, kind:'mock', exam:'P-2024-2-2', task:'模考1：2024下半年整卷 150分钟 + 复盘'};
    else if(dd===mock2) e = {date:dd, kind:'mock', exam:'P-2022-2-2', task:'模考2：2022下半年整卷 + 复盘'};
    else if(dd===mock3) e = {date:dd, kind:'mock', exam:'P-2021-2-2', task:'模考3：2021下半年整卷 + 复盘'};
    else if(dd===sprintA || dd===sprintB) e = {date:dd, kind:'redo', cases:redoAssign[dd]||[], task:(redoAssign[dd]&&redoAssign[dd].length)? '二刷（盖答案，只看错题与模糊题）':'错题本 + 默写清单'};
    else if(dd===finalA) e = {date:dd, kind:'final', task:'错题本清零 + 万能话术 + 计算卡'};
    else if(dd===finalB) e = {date:dd, kind:'final', task:'轻复习：默写清单速过 + 计算卡，早睡'};
    else if(dayNum(dd) >= examNum) e = {date:dd, kind:'exam', task: dd===exam? '🎯 考试日（科目一 9:00-11:30 / 科目二 14:00-16:30）' : '考试周（保持状态，轻量复习）'};
    if(e) out.push(e);
    dd = dateAdd(dd,1);
  }
  res.days = out;
  return res;
}

  if(!d.cases || !d.cases.length) return true;
  return d.cases.every(function(cid){ return caseState(cid).state==='done'; });

    +'<p class="planlegend" style="margin-bottom:0">进度：<i class="dot none"></i>未做 &nbsp; <i class="dot ans"></i>已答待自评</p>'
    +'<p class="planlegend">自评：<i class="dot ok"></i>会 &nbsp; <i class="dot mid"></i>模糊 &nbsp; <i class="dot no"></i>不会</p></div>';
  if(auto){
    var dp = dynPlan();
    if(dp.ended){
      h += '<div class="card"><p style="margin:0">考试已结束（'+examDateText()+'）。自由复习：优先错题本与默写清单。 · <span class="pcase" onclick="go(\'sprint\')">📐 打开冲刺手册</span></p></div>';
      view.innerHTML = h; return;
    }
    var undoneN = dp.firstPass.length;
    var msgs = [];
    if(dp.overdueN) msgs.push('原计划中 '+dp.overdueN+' 题已过期，已自动顺延');
    if(undoneN) msgs.push('首轮未完成 '+undoneN+' 题 · 剩余 '+dp.remainDays+' 天 · 建议每天约 '+dp.perDay+' 题');
    else msgs.push('✅ 首轮全覆盖完成'+(dp.redoOn&&dp.redoN? ' · 二刷 '+dp.redoN+' 题已排入 '+fmtMD(dateAdd(dp.exam,-5))+'~'+fmtMD(dateAdd(dp.exam,-4)) : ''));
    if(undoneN && dp.perDay>3) msgs.push('⚠ 每日任务偏重，建议优先 T0/T1，T2 可选做');
    if(dp.unscheduled.length) msgs.push('⚠ 仍有 '+dp.unscheduled.length+' 题排不进首轮，建议只挑 T0/T1 过一遍');
    var warnColor = (undoneN && (dp.perDay>3 || dp.unscheduled.length))? 'var(--warn)' : 'var(--tx2)';
    h += '<div class="card"><p style="margin:0;color:'+warnColor+'">'+msgs.map(esc).join('<br>')+'</p>'
      +'<p class="muted" style="margin-top:6px">动态重排：只排<b>未完成</b>的题（T0→T1→T2 优先级），按剩余天数均摊；模考与考前冲刺日固定。每小问自评后计为完成。 · <span class="pcase" onclick="go(\'sprint\')">📐 打开冲刺手册</span></p></div>';
    h += '<div class="card">';
    dp.days.forEach(function(e){
      var ds = dayStats(e);
      var label = e.kind==='study'? '首轮' : (e.kind==='mock'? '模考' : (e.kind==='redo'? ((e.cases&&e.cases.length)? '二刷':'默写') : (e.kind==='final'? '冲刺' : '考试')));
      var dayProg = ds.tot? '<br><span class="pdayprog'+(ds.done===ds.tot?' full':'')+'">'+ds.done+'/'+ds.tot+' 完成</span>' : '';
      h += '<div class="pday'+(e.date===today()?' today':'')+'"><div class="dt">'+fmtMD(e.date)+'<br>'+label+dayProg+'</div><div style="flex:1">';
      if(e.cases && e.cases.length){
        e.cases.forEach(function(cid){
          var c = DB.cases[cid]; if(!c) return;
          h += '<span style="margin-right:12px">'+tierTag(cid)+'<span class="pcase" onclick="openCase(\''+cid+'\')"><span class="tag s2">'+c.year+halfName(c.half)+'</span>试题'+c.cn+(c.title?' '+esc(c.title):'')+'</span>'+planCaseStateHTML(cid)+caseDots(cid)+'</span>';
        });
      } else {
        h += '<span>'+esc(e.task||'')+'</span>'+(e.exam? ' <button class="btn sm" onclick="startExam(\''+e.exam+'\')">开始模考</button>':'');
      }
      h += '</div></div>';
    });
    h += '</div>';
  } else {
    var phases = {
      1:'① 近3年12题 · 必背原型（9/17-9/22）',
      2:'② 预测池10题 · 高概率复刻（9/23-9/27）',
      3:'③ 旧题全覆盖 · 2016-2022（9/28-10/9）',
      4:'④ 二轮错题 + 模考（10/10-10/18）',
      5:'⑤ 考前冲刺（10/19-10/23）'
    };
    h += '<div class="card"><p class="muted" style="margin:0">原计划为理想日历（9/17-10/23）；每天：默写→对答案→自评「会/模糊/不会」，<b>每小问自评后计为完成</b>。落下的任务不会自动顺延，可切到「动态重排」查看顺延安排。考试日 '+examDateText()+'。 · <span class="pcase" onclick="go(\'sprint\')">📐 打开冲刺手册</span></p></div>';
    h += '<div class="card">';
    var curPhase = 0;
    PLAN.schedule.forEach(function(d){
      if(d.phase!==curPhase){ curPhase = d.phase; h += '<div class="phase-hd">'+phases[d.phase]+'</div>'; }
      var ds = dayStats(d);
      var overCls = '';
      if(isBeforeToday(d.date) && !dayComplete(d)) overCls = ds.ans===ds.tot? ' overdue-todo' : ' overdue';
      var cls = 'pday' + (d.date===today()?' today':'') + overCls;
      var dayProg = ds.tot? '<br><span class="pdayprog'+(ds.done===ds.tot?' full':'')+'">'+ds.done+'/'+ds.tot+' 完成</span>' : '';
      h += '<div class="'+cls+'"><div class="dt">'+d.date.replace('2026-','')+'<br>'+esc(d.task||'')+dayProg+'</div><div style="flex:1">';
      if(d.cases && d.cases.length){
        d.cases.forEach(function(cid){
          var c = DB.cases[cid]; if(!c) return;
          h += '<span style="margin-right:12px"><span class="pcase" onclick="openCase(\''+cid+'\')"><span class="tag s2">'+c.year+halfName(c.half)+'</span>试题'+c.cn+(c.title?' '+esc(c.title):'')+'</span>'+planCaseStateHTML(cid)+caseDots(cid)+'</span>';
        });
      } else {
        h += '<span>'+esc(d.task||'')+'</span>'+(d.exam? ' <button class="btn sm" onclick="startExam(\''+d.exam+'\')">开始模考</button>':'');
      }
      if(d.focus) h += '<div class="muted" style="margin-top:2px">🎯 '+esc(d.focus)+'</div>';
      h += '</div></div>';
    });
    h += '</div>';
  }
  view.innerHTML = h;
}

/* ================= 冲刺手册页 ================= */
var sprintTab = 'checklist', sprintMod = 'all', sprintSearch = '', sprintOnly = 'all', sprintHideAns = false, hbShown = {};
function setSprintTab(t){ sprintTab = t; sprintSearch = ''; vSprint(); }
function openSprint(tab, focusId){
  sprintTab = tab || 'checklist';

    var el = document.getElementById('sc_'+focusId);

}
function hbToggleBlock(id){ var b = document.getElementById(id); if(b) b.style.display = b.style.display==='none'? 'block':'none'; }
function hbToggle(id){
  hbShown[id] = !hbShown[id];
  var row = document.getElementById('hb_'+id);
  if(!row) return;
  var a = row.querySelector('.hb-a');
  var b = row.querySelector('.markbtns button');
  if(a) a.style.display = hbShown[id]? 'block':'none';
  if(b) b.textContent = hbShown[id]? '收起答案':'显示答案';
}
function hbMarkRow(id, m){
  hbMark(id, m);

}
function sprintRefreshProg(){
  var el = document.getElementById('sprintProg');
  if(el) el.innerHTML = sprintProgHTML();
}
function hbCkCount(){ var n=0; hbCardIds().forEach(function(id){ if(hbCk(id)) n++; }); return n; }
function sprintProgHTML(){
  var ids = hbCardIds(), ok=0, mid=0, no=0, ck=0;
  ids.forEach(function(id){
    var r=store.hb[id];
    if(r && r.ck) ck++;
    if(!r) return;
    if(r.m===2) ok++; else if(r.m===1) mid++; else no++;
  });
  return '已背 <b style="color:var(--ok)">'+ck+'</b> / 已掌握 '+ok+' / 模糊 <b style="color:var(--warn)">'+mid+'</b> / 不会 <b style="color:var(--ng)">'+no+'</b> / 共 '+ids.length+' 条';

function hbCk(id){ return !!(store.hb[id] && store.hb[id].ck); }
function hbToggleCk(id){
  var r = store.hb[id] || {n:0};
  r.ck = !r.ck; r.ts = Date.now();
  store.hb[id] = r; save();
  var btn = document.getElementById('ck_'+id);
  if(btn) btn.textContent = r.ck? '☑' : '☐';
  var row = document.getElementById('hb_'+id);

function hbItemRowHTML(id){

    + '<div class="hb-q"><button class="ckbtn" id="ck_'+id+'" onclick="hbToggleCk(\''+id+'\')">'+(ck?'☑':'☐')+'</button> '+sanitize(hb.q||hb.title||'')+'</div>'

    + '<button class="btn sm '+(r.m===1?'on':'')+'" onclick="hbMarkRow(\''+id+'\',1)">😐 模糊</button>'

        var s = sprintSearch.toLowerCase();
        if(String(it.q+' '+it.a).toLowerCase().indexOf(s)<0) return false;

    });

      h += '<tr id="hb_'+it.id+'" class="'+(ck?'cked':'')+'">'
        + '<td class="ck"><button class="ckbtn" id="ck_'+it.id+'" onclick="hbToggleCk(\''+it.id+'\')">'+(ck?'☑':'☐')+'</button></td>'
        + '<td class="q" onclick="hbRowReveal(\''+it.id+'\')">'+sanitize(it.q)+'</td>'
        + '<td class="ans" onclick="hbRowReveal(\''+it.id+'\')">'+sanitize(it.a)+'</td></tr>';
    });
    h += '</table>';
  });
  return h;

}
function hbStartCards(){
  var ids = [];

    if(sprintMod!=='all' && String(sprintMod)!==String(i)) return;

function hbCalcCk(cid){
  var w = calcWeek();
  var r = store.hbCalc[cid] || {week:w, n:0};
  if(r.week!==w){ r.week=w; r.n=0; }
  r.ck = !r.ck; r.ts = Date.now();
  store.hbCalc[cid] = r; save();
  vSprint();
}
function hbCalcDone(cid){
  var w = calcWeek();
  var r = store.hbCalc[cid] || {week:w, n:0};
  if(r.week!==w){ r.week=w; r.n=0; }
  r.n = (r.n||0)+1;
  store.hbCalc[cid] = r; save();
  toast('已记录：本周 '+r.n+' 次');
  vSprint();
}
function calcWeekSummary(){
  var w = calcWeek(), parts = [];
  (HB.calcs||[]).forEach(function(c){
    var r = store.hbCalc[c.id] || {};
    var n = (r.week===w)? (r.n||0):0;
    parts.push(esc(c.title.replace(/^卡\s*\d+：/,''))+' '+n+'次');
  });
  return parts.join(' / ') || '—';
}

    + '<div class="row" style="margin-top:8px">'

function unitSprintButtonsHTML(uid){
  var out = [];
  (HB.calcs||[]).forEach(function(c){ if((c.units||[]).indexOf(uid)>=0) out.push('<button class="btn sm" onclick="openSprint(\'calc\',\''+c.id+'\')">📐 '+esc(c.title)+'</button>'); });
  (HB.scripts||[]).forEach(function(s){ if((s.units||[]).indexOf(uid)>=0) out.push('<button class="btn sm" onclick="openSprint(\'script\',\''+s.id+'\')">💬 '+esc(s.title)+'</button>'); });

  return '<div class="row" style="margin-top:6px"><span class="muted">冲刺手册:</span>'+out.join('')+'</div>';

/* ================= 上午场 ================= */
var session = null;
function vAM(arg){
  if(arg && arg.session){ renderSession(); return; }
  var h = '<div class="card"><h2>上午场 · 选择题刷题 (科目一)</h2>'
    +'<div class="row" style="margin-bottom:10px"><span class="muted">范围:</span>'
    +'<select id="dScope"><option value="all">全部年份</option>';
  DB.papers.filter(p=>p.subject===1).forEach(function(p){ h+='<option value="'+p.id+'">'+p.title+'</option>'; });
  h += '</select><span class="muted">模式:</span>'
    +'<select id="dMode"><option value="seq">顺序</option><option value="rand">随机</option><option value="undone">仅未做</option><option value="wrong">仅错题</option></select>'
    +'<select id="dType"><option value="all">全部</option><option>原理</option><option>计算</option><option>法规</option><option>工具</option><option>场景</option></select>'
    +'<span class="muted">数量:</span><select id="dN"><option>10</option><option>20</option><option selected>25</option><option>50</option><option value="999">全部</option></select>'
    +'<button class="btn pri" onclick="startDrill()">开始</button></div>'
    +'<p class="muted">只有答错才进错题本；在任意模块连对 N 次自动移出（N 可在错题本/设置中调整）。真题卡也可在「知识点」抽卡模式中出现。</p></div>';
  var wl = wrongList().filter(function(q){ return DB.questions[q]; }).slice(0,8);
  h += '<div class="card"><h3 style="margin-top:0">上午错题速览</h3>';
  if(!wl.length) h+='<p class="muted">暂无错题</p>';
  wl.forEach(function(q){
    var item = DB.questions[q];
    h+='<div class="wrongs-item"><span>'+item.year+halfName(item.half)+' · 第'+item.num+'题 · '+esc(qPreviewText(item,42).slice(0,42))+'…</span><button class="btn sm" onclick="redoOne(\''+q+'\')">重做</button></div>';
  });
  h += '</div>';
  view.innerHTML = h;
}
function startDrill(){
  var scope = document.getElementById('dScope').value,
      mode = document.getElementById('dMode').value,
      n = +document.getElementById('dN').value;
  var ids;
  if(scope==='all'){ ids=[]; DB.papers.filter(p=>p.subject===1).forEach(p=>ids=ids.concat(p.qids)); }
  else ids = DB.papers.find(p=>p.id===scope).qids.slice();
  if(mode==='undone') ids = ids.filter(function(q){ return !store.rec[q]; });
  if(mode==='wrong') ids = ids.filter(function(q){ var r=store.rec[q]; return r && r.wrong && (r.streak||0) < wrongMasterN(); });
  var dType = document.getElementById('dType') ? document.getElementById('dType').value : 'all';
  if(dType!=='all') ids = ids.filter(function(q){ return (CARDS.meta.qtype[q]||[]).indexOf(dType)>=0; });
  if(mode==='rand') ids.sort(function(){return Math.random()-.5;});
  ids = ids.slice(0, n);
  if(!ids.length){ toast('该范围内没有符合条件的题目'); return; }
  session = {ids:ids, i:0, answered:false};
  go('am', {session:1});
}
function renderSession(){
  var q = DB.questions[session.ids[session.i]];
  var g = q.group? DB.groups[q.group] : null;
  var r0 = store.rec[q.id] || {};
  var need = wrongMasterN();
  var opts = (q.options && q.options.length)? q.options : parseInlineOptions(q.stem, q.num);
  var stemShow = q.stem;
  if(!(q.options && q.options.length) && opts) stemShow = String(q.stem||'').replace(new RegExp('[（(]\\s*'+q.num+'\\s*[）)]\\s*A[.、．][\\s\\S]*$'), '');
  var h = '<div class="card">'
    +'<div class="row" style="justify-content:space-between"><span class="muted">'
    +(session.wrongDrill? ('🎯 错题重做 · 连对 <b>'+(r0.streak||0)+'</b>/'+need) : (q.year+halfName(q.half)+'上午 · 第 '+q.num+' 题'))
    +'</span><span class="muted">'+(session.i+1)+' / '+session.ids.length+'</span></div>'
    +'<div class="bar" style="margin:8px 0"><i style="width:'+Math.round(session.i/session.ids.length*100)+'%"></i></div>'
    +(g? '<div class="ana"><pre>'+esc(g.stem)+'</pre>'+(g.translation?'<details><summary class="muted">参考译文</summary><pre>'+esc(g.translation)+'</pre></details>':'')+'</div>':'')
    +'<div class="qtext">'+esc(stemShow)+'</div>';
  if(opts && opts.length===4){
    opts.forEach(function(o){
      var cls = 'opt';
      if(session.answered){
        cls += ' disabled';
        if(o.key===q.answer) cls+=' right'; else if(o.key===session.picked) cls+=' wrong';
      }
      h += '<button class="'+cls+'" '+(session.answered?'disabled':'')+' onclick="pick(\''+o.key+'\')"><b>'+o.key+'.</b> '+esc(o.text)+'</button>';
    });
  } else h += '<p><span class="tag warn">本题选项缺失(源文件缺)</span></p>';
  if(session.answered){
    var rNow = store.rec[q.id] || {};
    h += '<div class="ana"><b>'+(session.correct?'✅ 答对':'❌ 答错')+'</b>'+(q.answer?'　正确答案: <b>'+q.answer+'</b>':'　<span class="tag warn">源文件缺失答案(可在设置配置AI后于知识点模块补全)</span>')
      +(session.wrongDrill? '<div class="muted" style="margin-top:4px">本题连对：'+(rNow.streak||0)+'/'+need+((rNow.streak||0)>=need?' ✅ 已掌握（移出错题本）':'')+'</div>':'')
      +(q.analysis? '<pre>'+esc(q.analysis)+'</pre>':'')+'</div>';
    var kn = CARDS.meta.qunit[q.id] || ((CARDS.meta.qunitX[q.id]||[])[0]);
    if(kn && unitById(kn)){
      var kx = unitById(kn);
      h += '<div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="btn sm" onclick="sessionStudy(\''+q.id+'\')">📚 关联知识点：'+esc(kx.no+' '+kx.title)+'</button><span class="muted" style="margin-left:8px">可进入做题/背题/敲记</span></div>';
    }
  }
  h += '<div class="nav"><button class="btn" onclick="quitSession()">退出</button>'
    +'<span><button class="btn" onclick="nav(-1)" '+(session.i===0?'disabled':'')+'>上一题</button> '
    +'<button class="btn pri" onclick="nav(1)" '+(session.answered?'':'disabled')+'>'+(session.i+1<session.ids.length?'下一题':'完成')+'</button></span></div></div>';
  view.innerHTML = h;
}
function pick(k){
  if(session.answered) return;
  var q = DB.questions[session.ids[session.i]];
  session.picked=k; session.answered=true; session.correct = (q.answer && k===q.answer);
  var res = recordChoiceAnswer(q.id, k, session.correct);
  save();
  if(session.wrongDrill){
    if(res.mastered) toast('连对 '+wrongMasterN()+' 次，已掌握并移出错题本');
    else if(!session.correct) toast('答错，连对已重置，留在错题本');
  }
  renderSession();
}
function nav(d){ var ni=session.i+d; if(ni>=session.ids.length){ toast('本组完成！'); quitSession(); return; } session.i=ni; session.answered=false; session.picked=null; renderSession(); }
function quitSession(){ session=null; go('am'); }
function redoOne(qid){ session={ids:[qid], i:0, answered:false}; go('am',{session:1}); }

/* ================= 下午场 ================= */
var pmFilter = 'all';
function setPmFilter(f){ pmFilter = f; vPM(); }
function vPM(){
  var h = '<div class="card"><h2>下午场 · 案例分析 (科目二)</h2>'
    +'<p class="muted">逐卷学习：阅读案例→输入作答→对照参考答案/AI评分→自评掌握度。或整卷模拟考(150分钟计时+交卷AI评分)。</p>'
    +'<div class="row"><button class="btn pri" onclick="startExam()">🎬 整卷模拟考</button>'
    +'<span class="muted">AI评分需在设置中配置 DeepSeek 或 GLM Key（单卷评分约几分钱）</span></div></div>';
  if(PLAN.predictPool){
    var pp = DB.papers.find(function(x){ return x.id===PLAN.predictPool.id; });
    var ps = pp? paperStat(pp) : {done:0,total:0,pct:0};
    h += '<div class="card" style="border:2px solid var(--pri)"><div class="row" style="justify-content:space-between">'
      +'<b>🎯 '+esc(PLAN.predictPool.title)+'</b><span class="muted">10道高概率复刻题 · 已自评 '+ps.done+'/'+ps.total+' 问</span></div>'
      +'<div class="bar" style="margin:8px 0"><i style="width:'+ps.pct+'%"></i></div>'
      +'<button class="btn pri" onclick="openPaper(\''+PLAN.predictPool.id+'\')">进入预测卷</button></div>';
  }
  h += '<div class="card"><div class="row"><span>按层级刷：</span>'
    +'<button class="btn sm '+(pmFilter==='all'?'pri':'')+'" onclick="setPmFilter(\'all\')">全部卷</button>'
    +'<button class="btn sm '+(pmFilter==='0'?'pri':'')+'" onclick="setPmFilter(\'0\')">T0 近3年必背 (12)</button>'
    +'<button class="btn sm '+(pmFilter==='1'?'pri':'')+'" onclick="setPmFilter(\'1\')">T1 预测池 (10)</button>'
    +'<button class="btn sm '+(pmFilter==='2'?'pri':'')+'" onclick="setPmFilter(\'2\')">T2 其余 (24)</button></div>';
  if(pmFilter!=='all'){
    var ids = casesByTier(+pmFilter);
    var doneN = 0; ids.forEach(function(cid){ if(caseState(cid).state==='done') doneN++; });
    h += '<p class="muted" style="margin-top:8px">共 '+ids.length+' 题，已自评完成 '+doneN+' 题（每小问自评后计为完成）。点击题名直接进入该卷作答。</p></div><div class="card">';
    ids.forEach(function(cid){
      var c = DB.cases[cid]; if(!c) return;
      h += '<div class="wrongs-item"><span><span class="pcase" onclick="openCase(\''+cid+'\')"><span class="tag s2">'+c.year+halfName(c.half)+'</span>试题'+c.cn+(c.title?' '+esc(c.title):'')+'</span> '+tierTag(cid)+'</span><span>'+planCaseStateHTML(cid)+caseDots(cid)+'</span></div>';
    });
    h += '</div>';
  } else {
    h += '</div></div>';
    h += '<div class="grid">';
    DB.papers.filter(function(p){ return p.subject===2 && !p.virtual; }).forEach(function(p){
      var s = paperStat(p);
      h += '<div class="card pcard" style="margin:0" onclick="openPaper(\''+p.id+'\')"><b>'+p.title+'</b><br>'
        +'<span class="tag s2">下午·案例</span><span class="muted">'+p.cids.length+'道大题 · 已自评 '+s.done+'/'+s.total+' 问</span>'
        +'<div class="bar" style="margin-top:8px"><i style="width:'+s.pct+'%"></i></div></div>';
    });
    h += '</div>';
  }
  view.innerHTML = h;
}
function openPaper(pid){
  if(exam && exam.paperId===pid && !exam.submitted){ renderExam(); return; }
  var p = DB.papers.find(x=>x.id===pid);
  if(!p){ toast('试卷不存在'); return; }
  if(p.subject===1){ session={ids:p.qids.slice(), i:0, answered:false}; go('am',{session:1}); }
  else vCasePaper(p);
}
function caseBadge(c){
  var b = '';
  if(c.answerStatus==='reference') b+='<span class="tag warn">参考答案(非官方)</span>';
  else if(c.answerStatus==='compiled') b+='<span class="tag gray">回忆整理版</span>';
  else b+='<span class="tag ok">官方答案</span>';
  if(c.missing_subs&&c.missing_subs.length) b+='<span class="tag ng">原卷缺问题'+c.missing_subs.join(',')+'</span>';
  return b;
}
function subHeader(cid, s, opts){
  opts = opts||{};
  var key = cid+'#'+s.no;
  var r = store.caseRec[key]||{};
  var c = opts.caseTag? DB.cases[cid] : null;
  return '<div class="subq" id="sq_'+key.replace('#','_')+'">'
    +'<div class="hd">'+(c? '<span class="tag s2">'+c.year+halfName(c.half)+'案例'+c.cn+'</span> ':'')
    +'【问题'+s.no+'】'+(s.score?'（'+s.score+'分）':'')
    +(s.reconstructed?' <span class="tag warn">逆推题干</span>':'')
    +(s.answer?'':' <span class="tag warn">答案缺失</span>')
    +(opts.noRel? '' : ' <button class="btn sm" onclick="openCaseUnit(\''+cid+'\','+s.no+')">关联知识点</button>')
    +'</div>'
    +'<div class="qtext">'+sanitize(caseFmt(s.text)||'<i class="muted">题干缺失</i>')+'</div>';
}
function subBody(cid, s, opts){
  opts = opts || {};
  var key = cid+'#'+s.no, r = store.caseRec[key]||{};
  var kk = key.replace('#','_');
  var fresh = !!opts.fresh;
  if(fresh) freshDrafts[key] = 1; else delete freshDrafts[key];
  var hasOldDraft = (typeof r.draft==='string' && r.draft.trim()!=='');
  var hasPrev = (r.m!==undefined) || !!r.ai || hasOldDraft;
  var h = '<textarea id="ta_'+kk+'" placeholder="'+(fresh? '重做模式：输入新的作答（用于AI评分）…' : '在此输入你的作答（用于AI评分）…')+'" oninput="saveDraft(\''+key+'\', this.value)">'+(fresh? '' : esc(r.draft||''))+'</textarea>'
    +'<div class="muted" id="st_'+kk+'" style="font-size:12px;margin-top:2px">'+(fresh? freshStatusText(key) : subStatusText(key))+'</div>'
    +((fresh && (r.draftPrev || hasOldDraft))? '<div class="muted" id="rb_'+kk+'" style="font-size:12px"><span class="pcase" onclick="restorePrevDraft(\''+key+'\')">↩ 恢复上次作答</span></div>' : '')
    +'<div class="row" style="margin-top:8px">'
    +'<button class="btn sm pri" onclick="aiGrade(\''+key+'\')">🤖 AI评分</button>'
    +'<button class="btn sm" onclick="toggleReveal(\''+key+'\',\'a\')">显示参考答案</button>'
    +'<button class="btn sm" onclick="toggleReveal(\''+key+'\',\'an\')">显示解析</button>'
    +'<span class="muted" id="ai_'+kk+'"></span></div>'
    +'<div id="out_'+kk+'">'+((!fresh && r.ai)? renderAI(r.ai):'')+'</div>'
    +'<div class="reveal ans" id="ra_'+kk+'" style="display:none">'+(s.answer? sanitize(s.answer):'<span class="muted">源文件缺失，可用AI补全（批次4）</span>')+'</div>'
    +'<div class="reveal ana2" id="ran_'+kk+'" style="display:none">'+(s.analysis? sanitize(s.analysis):'<span class="muted">无解析</span>')+'</div>'
    +'<div class="markbtns">'
    +'<button class="btn sm '+((!fresh && r.m===2)?'on':'')+'" id="mk2_'+kk+'" onclick="markCase(\''+key+'\',2)">😀 会</button>'
    +'<button class="btn sm '+((!fresh && r.m===1)?'on':'')+'" id="mk1_'+kk+'" onclick="markCase(\''+key+'\',1)">😐 模糊</button>'
    +'<button class="btn sm '+((!fresh && r.m===0)?'on':'')+'" id="mk0_'+kk+'" onclick="markCase(\''+key+'\',0)">😰 不会</button>'
    +'</div>'
    +((fresh && hasPrev)? '<details style="margin-top:8px;font-size:13px"><summary class="muted">📄 上次记录（'+esc(prevSummary(r))+'）</summary>'
        + '<div class="ana" style="margin-top:6px">'
        + (r.m!==undefined? '<div><b>上次自评：</b>'+(r.m===2?'会':(r.m===1?'模糊':'不会'))+'</div>' : '')
        + (r.ai? '<div style="margin-top:6px"><b>上次 AI 评分：</b></div>'+renderAI(r.ai) : '')
        + (hasOldDraft? '<div style="margin-top:6px"><b>上次作答草稿：</b></div><pre>'+esc(r.draft)+'</pre>' : '')
        + '</div></details>' : '');
  return h;
}
function prevSummary(r){
  var parts = [];
  if(r.m!==undefined) parts.push('已自评：'+(r.m===2?'会':(r.m===1?'模糊':'不会')));
  if(r.ai) parts.push('AI已评 '+((r.ai.score!==undefined)? (r.ai.score+'/'+(r.ai.max||'?')) : ''));
  if(typeof r.draft==='string' && r.draft.trim()!=='') parts.push('旧草稿'+(r.ts? ' '+fmtClock(r.ts):''));
  return parts.join(' · ');
}
function vCasePaper(p){
  currentPaperId = p.id;
  currentView = 'pm';
  var h = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+p.title+' · 案例真题</h2>'
    +'<div class="row"><button class="btn sm" onclick="startExam(\''+p.id+'\')">🎬 本卷模拟考</button>'
    +'<button class="btn sm" onclick="openCheatModal()">🧭 速查</button>'
    +'<button class="btn sm" onclick="openSprint(\'script\')">💬 话术</button>'
    +'<button class="btn sm" onclick="go(\'pm\')">返回</button></div></div>'
    +'<p class="muted">先自己作答再对照答案。每小问自评（会/模糊/不会）后计入进度；自评「会」后移出错题本。</p></div>';
  p.cids.forEach(function(cid){
    var c = DB.cases[cid];
    h += '<div class="card"><b style="font-size:16px">试题'+c.cn+'</b>'+(c.score?'（共'+c.score+'分）':'')
      +(c.title?' · '+esc(c.title):'')+' '+caseBadge(c)+' '+tierTag(cid)+' '+planCaseStateHTML(cid)+caseDots(cid)
      +(c.md_overview? '<details><summary>📘 官方解析书·本题总述</summary><div class="ana"><pre>'+esc(c.md_overview)+'</pre></div></details>':'')
      +'<div class="case qtext">'+sanitize(c.scenario||'')+'</div>'
      + explainBoxHTML(cid);
    var relPairs = [];
    c.qs.forEach(function(s){
      var uid = caseUnitOf(cid, s.no);
      if(uid && !relPairs.some(function(x){ return x.uid===uid; })) relPairs.push({uid:uid, no:s.no});
    });
    if(relPairs.length){
      h += '<div class="row" style="margin-top:6px"><span class="muted">本题相关知识点:</span>'
        + relPairs.slice(0,6).map(function(rp){
            var x = unitById(rp.uid);
            return '<button class="btn sm" onclick="openCaseUnit(\''+cid+'\','+rp.no+')">'+esc(x? (x.no+' '+x.title) : rp.uid)+'</button>';
          }).join('') + '</div>';
    }
    c.qs.forEach(function(s){ h += subHeader(cid,s) + subBody(cid,s) + '</div>'; });
    h += '</div>';
  });
  view.innerHTML = h;
}
function toggleReveal(key, which){
  var el = document.getElementById((which==='a'?'ra_':'ran_')+key.replace('#','_'));
  if(el) el.style.display = el.style.display==='none'? 'block':'none';
}
function fmtClock(ts){ var d=new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function subStatusText(key){
  var r = store.caseRec[key]||{};
  var parts = [];

      .then(function(res){

        var lh = '<div class="wrongs-item"><span>'+k.c.cn+'【问题'+k.s.no+'】</span><span><b style="color:var(--pri)">'+res.result.score+'/'+res.result.max+'</b> <button class="btn sm" onclick="openPaper(\''+exam.paperId+'\')">查看</button></span></div>';
        var el = document.getElementById('exList'); el.innerHTML = lh + el.innerHTML;

      .then(function(){ i++; setTimeout(step, 400); });
  }
  step();
}

var currentUnitId = null;
function unitQMode(){ return (store.settings.qMode==='read')? 'read' : 'quiz'; }
function unitQProgText(uid){
  var qs = unitQuestions(uid), cs = unitCases(uid);
  var qd = 0; qs.forEach(function(qid){ if(store.rec[qid] && store.rec[qid].a!==undefined) qd++; });
  var cd = 0; cs.forEach(function(k){ var r=store.caseRec[k]; if(r && r.m!==undefined) cd++; });
  return '已做 '+(qd+cd)+' / '+(qs.length+cs.length);
}
function updateUnitQProg(){
  var el = document.getElementById('uqProg');
  if(el && currentUnitId) el.textContent = unitQProgText(currentUnitId);
}
function setUnitQMode(m, uid){
  store.settings.qMode = (m==='read')? 'read':'quiz';

  currentUnitId = uid || currentUnitId;
  var box = document.getElementById('unitQBox');
  if(box) box.innerHTML = unitQuizHTML(currentUnitId);
}
function unitQInner(qid, mode){
  var q = DB.questions[qid];
  if(!q) return '';
  var ep = CARDS.meta.qpoint[qid];
  var r = store.rec[qid]||{};
  var stemHTML = q.stem? esc(q.stem) : (q.group? '<span class="muted">（组题：请阅读上方共用材料后作答）</span>' : '<span class="muted">(题干缺失)</span>');
  var head = '<div class="hd">'+q.year+halfName(q.half)+' 第'+q.num+'题'+(ep?' · <span class="muted">考点: '+esc(ep)+'</span>':'')+'</div>'
    + '<div class="qtext">'+stemHTML+'</div>';
  var opts = q.options||[];
  if(mode==='read' || r.a!==undefined){
    var html = opts.map(function(o){
      var cls = 'opt disabled';
      if(o.key===q.answer) cls += ' right';
      else if(r.a===o.key) cls += ' wrong';
      return '<button class="'+cls+'" disabled><b>'+o.key+'.</b> '+esc(o.text)+'</button>';
    }).join('');
    var res = (r.a!==undefined)? (r.ok? ' <b style="color:var(--ok)">✅ 答对</b>' : ' <b style="color:var(--ng)">❌ 答错</b>') : '';
    return head + html
      + '<div class="ana">'+res+' 正确答案: '+(q.answer||'?')+(q.analysis?'<pre>'+esc(q.analysis)+'</pre>':'')+'</div>'
      + ((mode==='quiz' && r.a!==undefined)? '<div class="row" style="margin-top:6px"><button class="btn sm" onclick="unitQRedo(\''+qid+'\')">重做本题</button></div>' : '');
  }
  return head + opts.map(function(o){
    return '<button class="opt" onclick="unitQAnswer(\''+qid+'\',\''+o.key+'\')"><b>'+o.key+'.</b> '+esc(o.text)+'</button>';
  }).join('');
}
function unitQAnswer(qid, key){
  var q = DB.questions[qid];
  if(!q) return;
  var ok = !!(q.answer && key===q.answer);
  var res = recordChoiceAnswer(qid, key, ok);
  save();
  bumpDaily('r');
  srsGrade(qid, ok?2:0);
  var box = document.getElementById('uq_'+qid);
  if(box) box.innerHTML = unitQInner(qid, 'quiz');
  updateUnitQProg();
  if(res.mastered) toast('连对 '+wrongMasterN()+' 次，已掌握并移出错题本');
}
function unitQRedo(qid){
  var r = store.rec[qid];

  if(box) box.innerHTML = unitQInner(qid, 'quiz');

}
function unitQuizHTML(uid){
  var qs = unitQuestions(uid), cs = unitCases(uid);
  var mode = unitQMode();
  var h = '<div class="row" style="justify-content:space-between"><h3 style="margin:0">③ 相关真题 ('+qs.length+'选择 + '+cs.length+'案例问)</h3>'
    + '<div class="row">'
    + '<button class="btn sm '+(mode==='quiz'?'pri':'')+'" onclick="setUnitQMode(\'quiz\',\''+uid+'\')">做题模式</button>'
    + '<button class="btn sm '+(mode==='read'?'pri':'')+'" onclick="setUnitQMode(\'read\',\''+uid+'\')">背题模式</button>'
    + '<span class="muted" id="uqProg">'+unitQProgText(uid)+'</span>'
    + '</div></div>';
  if(!qs.length && !cs.length) return h + '<p class="muted" style="margin-top:8px">暂无直接关联真题（可用范围抽卡练习本章节）</p>';
  var lastGroup = null;
  function qBlock(qid){
    var q = DB.questions[qid]; if(!q) return '';
    var pre = '';
    if(q.group){
      if(q.group !== lastGroup){
        var g = DB.groups[q.group];
        if(g) pre += '<div class="ana" style="margin-top:10px"><b>📖 组题材料（共用）</b><pre>'+esc(g.stem)+'</pre>'
          +(g.translation? '<details><summary class="muted">参考译文</summary><pre>'+esc(g.translation)+'</pre></details>':'')+'</div>';
      }
      lastGroup = q.group;
    } else lastGroup = null;
    return pre + '<div class="subq" id="uq_'+qid+'">'+unitQInner(qid, mode)+'</div>';
  }
  qs.slice(0,20).forEach(function(qid){ h += qBlock(qid); });
  if(qs.length>20){
    h += '<details style="margin-top:8px"><summary>显示其余 '+(qs.length-20)+' 道选择题</summary>';
    qs.slice(20).forEach(function(qid){ h += qBlock(qid); });
    h += '</details>';
  }
  cs = cs.slice().sort(function(a,b){
    var ca = DB.cases[a.split('#')[0]], cb = DB.cases[b.split('#')[0]];
    if(!ca) return 1; if(!cb) return -1;
    var ka = [ca.year, ca.half, ca.cn, +a.split('#')[1]], kb = [cb.year, cb.half, cb.cn, +b.split('#')[1]];
    for(var i=0;i<4;i++){ if(ka[i]!==kb[i]) return ka[i]-kb[i]; }
    return 0;
  });
  function caseQHTML(k){
    var p = k.split('#'), c = DB.cases[p[0]];
    if(!c) return '';
    var sub = c.qs.find(function(x){ return x.no==p[1]; });
    if(!sub) return '';
    if(mode==='quiz') return subHeader(p[0], sub, {noRel:true, caseTag:true}) + caseCtxHTML(p[0], sub) + subBody(p[0], sub) + '</div>';
    return '<div class="subq"><div class="hd"><span class="tag s2">'+c.year+halfName(c.half)+'案例'+c.cn+'</span> 问题'+p[1]+'</div>'
      + '<div class="qtext">'+sanitize(caseFmt(sub.text))+'</div>'
      + caseCtxHTML(p[0], sub)
      + '<div class="reveal ans">'+(sub.answer? sanitize(sub.answer):'(缺失)')+'</div>'
      + (sub.analysis? '<div class="reveal ana2" style="margin-top:6px">'+sanitize(sub.analysis)+'</div>':'')
      + '</div>';
  }
  var lastCase = null;
  function caseBlock(k){
    var cid = k.split('#')[0], c = DB.cases[cid];
    var pre = '';
    if(c && cid !== lastCase){
      pre = '<div class="muted" style="margin-top:14px;font-weight:700">📄 '+c.year+halfName(c.half)+' 案例'+c.cn+(c.title?' · '+esc(c.title):'')+'</div>';
      lastCase = cid;
    }
    return pre + caseQHTML(k);
  }
  cs.slice(0,8).forEach(function(k){ h += caseBlock(k); });
  if(cs.length>8){
    h += '<details style="margin-top:8px"><summary>显示其余 '+(cs.length-8)+' 道案例小题</summary>';
    cs.slice(8).forEach(function(k){ h += caseBlock(k); });
    h += '</details>';
  }
  return h;
}

function renderTypeStep(){

      +'<button class="btn sm" onclick="vUnit(\''+typeRun.uid+'\')">返回知识点</button></div>';

  }

    +'<div class="row" style="margin-top:8px"><input type="text" id="typeIn" style="flex:1;min-width:200px" placeholder="键入后回车" onkeydown="if(event.key===\'Enter\')checkType()">'

function typeHint(){

}
function checkType(){
  var ans = typeRun.list[typeRun.idx];
  var val = document.getElementById('typeIn').value;
  var fb = document.getElementById('typeFb');
  if(typeMatch(val, ans)){
    typeRun.hits++; fb.innerHTML = '<span class="tag ok">✓ 正确: '+esc(ans)+'</span>';
    typeRun.idx++; setTimeout(renderTypeStep, 700);
  } else {
    fb.innerHTML = '<span class="tag ng">✗ 再想想</span>';
  }
}
function showTypeAns(){
  var ans = typeRun.list[typeRun.idx];
  document.getElementById('typeFb').innerHTML = '<span class="tag warn">答案: '+esc(ans)+'</span>';
  typeRun.idx++; setTimeout(renderTypeStep, 1200);
}
function typeMatch(input, answer){
  var i = normType(input), a = normType(answer);
  if(!i || !a) return false;
  if(a.length <= 6) return i === a;
  if(i.length < a.length*0.7) return false;
  var inter=0, used={};
  a.split('').forEach(function(c){ used[c]=(used[c]||0)+1; });
  i.split('').forEach(function(c){ if(used[c]>0){ inter++; used[c]--; } });
  return inter/a.length >= 0.85;
}
function normType(s){ return String(s||'').toLowerCase().replace(/\s+/g,'').replace(/[，。、；：,.;:()（）"']/g,''); }

/* ---- 抽卡 ---- */
function startKnow(extra, quota){
  var due=[], fresh=[], review=[];
  allCardIds().forEach(function(id){
    if(!inScope(id)) return;
    var s = srsGet(id);
    if(!s) fresh.push(id);
    else if(s.due <= Date.now()) due.push(id);
    else review.push(id);
  });
  due.sort(function(a,b){ return srsGet(a).due - srsGet(b).due; });
  var t = taskCounts();
  var ids = due.slice();
  var isNewMap = {};
  if(!extra){
    var q = (quota===undefined)? t.newQuota : Math.max(0, +quota||0);
    var fk = fresh.sort(function(){return Math.random()-.5;}).slice(0, q);
    fk.forEach(function(x){ isNewMap[x]=1; });
    ids = ids.concat(fk);
  }
  if(!ids.length) ids = review.sort(function(){return Math.random()-.5;}).slice(0, 15);
  if(!ids.length){ toast('范围内暂无卡片'); return; }
  ksession = {ids:ids, isNewMap:isNewMap, i:0, flipped:false, answered:false};
  renderKCard();
}
function renderKCard(){
  if(ksession.i >= ksession.ids.length){
    var isHb = (ksession.ids[0]||'').indexOf('HB-')===0;
    var h = '<div class="card" style="text-align:center;padding:40px"><h2>🎉 本轮完成！</h2><p class="muted">共 '+ksession.ids.length+' 张</p>'
      +'<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" onclick="ksession=null;'+(isHb?'vSprint()':'vKnow()')+'">'+(isHb?'返回冲刺页':'返回知识点')+'</button>'
      + (isHb? '' : '<button class="btn" onclick="ksession=null;startKnow(true)">继续加练</button>')
      + '</div></div>';
    view.innerHTML = h; return;
  }
  var id = ksession.ids[ksession.i];
  var info = cardInfo(id);
  var st = srsGet(id);
  var h = '<div class="card">'
    +'<div class="row" style="justify-content:space-between"><span class="muted">'+(ksession.hbDrill? '<span class="tag s3">🃏 手册错题重做</span> ':'')+(ksession.i+1)+' / '+ksession.ids.length
    +(!st?' · <span class="tag s1">新卡</span>':(st.ivl?' · 间隔'+st.ivl+'天':''))+'</span>'
    +'<span class="row"><button class="btn sm" onclick="kCardDetail(\''+id+'\')">详情</button>'
    +'<button class="btn sm" onclick="ksession=null;vKnow()">退出</button></span></div>';
  if(info.type==='question'){ h += renderQCard(id); }
  else if(info.type==='case'){ h += renderCaseCard(id, info); }
  else if(info.type==='handbook'){ h += renderHandbookCard(id, info); }
  else { h += renderFlipCard(id, info); }
  h += '</div>';
  view.innerHTML = h;
}
function kCardDetail(id){
  var info = cardInfo(id);
  if(!info){ go('know'); return; }
  if(info.type==='unit'){ vUnit(id); return; }
  if(info.type==='handbook'){ go('sprint'); return; }
  if(info.type==='case'){ openCase(id.split('#')[0]); return; }
  if(info.type==='question'){
    var uid = CARDS.meta.qunit[id] || ((CARDS.meta.qunitX[id]||[])[0]);
    if(uid && unitById(uid)){ vUnit(uid); return; }
    var m = CARDS.meta.qch[id];
    if(m){ vChapter(m.subject, m.ch); return; }
  }
  go('know');
}

}

    +'<p class="muted">错误分类：401=Key无效 / 402=余额不足 / 404=模型名不存在 / 429=限流 / 其余=网络或跨域问题。</p></div>'
    +'<div class="card"><h2>🧠 学习设置</h2>'
    +'<div class="row"><span>考试日期:</span>'
    +'<input type="date" id="examDate" value="'+esc(s.examDate||'2026-10-24')+'">'
    +'<button class="btn sm" onclick="saveExamDate()">保存</button>'
    +'<span class="muted">距考试 <b>'+daysToExam()+'</b> 天</span></div>'
    +'<div class="row" style="margin-top:8px"><span>每日新学:</span>'

    +'<button class="btn pri" onclick="saveNpd()">保存</button></div>'
    +'<div class="row" style="margin-top:8px"><span>界面宽度:</span>'
    +'<select id="pgw" onchange="onPageWidthSel(this)">'+pgwOpts+'</select>'

    +'<span class="muted">当前 '+(pw==='full'?'全宽':pw+'px')+'（即时生效）</span></div>'
    +'<div class="row" style="margin-top:8px"><span>错题本刷题:</span>'+wrongCfgRow('sw')

    +'<button class="btn sm" onclick="disableBackup()">关闭自动备份</button></div></div></div>';
}
function saveProvider(code){
  var el = document.getElementById(code+'Key');
  if(!el){ toast('请先进入设置页'); return false; }
  var pre = (code==='deepseek')? 'ds' : code;
  store.settings[pre+'Key'] = el.value.trim();
  var mel = document.getElementById(code+'Model');
  store.settings[pre+'Model'] = (mel? mel.value.trim():'') || (code==='deepseek'?'deepseek-chat':'glm-4.7-flash');
  var ok = saveSettings();
  var st = document.getElementById(code+'Test');
  if(st && !st.innerHTML) st.innerHTML = ok? '<span class="tag ok">已保存到浏览器</span>' : '<span class="tag ng">保存失败：浏览器存储不可用（已由 keys.js 兜底）</span>';
  toast(ok? (code+' 配置已保存') : (code+' 未保存：浏览器存储不可用'));
  return ok;
}
function setProvider(v){
  store.settings.provider = v;
  var ok = saveSettings();
  toast(ok? '已保存优先使用: '+(v==='glm'?'GLM':'DeepSeek') : '保存失败：浏览器存储不可用');
}
function pickModel(code, v){
  if(v) document.getElementById(code+'Model').value = v;
}
function loadModels(code){
  var el = document.getElementById(code+'Test');
  var key = document.getElementById(code+'Key').value.trim();
  if(!key){ el.innerHTML = '<span class="tag warn">先填Key</span>'; return; }
  el.innerHTML = '<span class="spin"></span> 拉取中…';
  var p = {code:code, modelsUrl: code==='deepseek'? 'https://api.deepseek.com/models':'https://open.bigmodel.cn/api/paas/v4/models', key:key};
  fetchModelList(p).then(function(ids){
    var sel = document.getElementById(code+'ModelSel');
    if(sel) sel.innerHTML = '<option value="">选择模型…</option>'+ids.map(function(x){ return '<option value="'+esc(x)+'">'+esc(x)+'</option>'; }).join('');
    var inp = document.getElementById(code+'Model');
    if(inp && ids.length && ids.indexOf(inp.value.trim())<0) inp.value = ids[0];
    el.innerHTML = '<span class="tag ok">✓ '+ids.length+'个'+(inp&&ids[0]===inp.value? '，已自动选择 '+esc(ids[0]):'，请从下拉选择')+'</span>';
  }).catch(function(e){ el.innerHTML = '<span class="tag ng">'+esc(classifyErr(e))+'</span>'; });
}
function testOne(code){
  var el = document.getElementById(code+'Test');
  saveProvider(code);
  var p = llmProviders().find(function(x){ return x.code===code; });
  if(!p){ el.innerHTML = '<span class="tag warn">Key为空</span>'; return; }
  el.innerHTML = '<span class="spin"></span> 测试 '+esc(p.model)+' …';
  fetchT(p.url, {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+p.key},
    body:JSON.stringify({model:p.model, messages:[{role:'user',content:'只回复两个字:连通'}], max_tokens:20, stream:false})})
    .then(function(r){ if(!r.ok) return httpErr(r); return r.json(); })
    .then(function(j){
      var m = j.choices&&j.choices[0]&&j.choices[0].message;
      var txt = (m&&(m.content||m.reasoning_content))||'';
      el.innerHTML = '<span class="tag ok">✓ 连通 模型:'+esc(p.model)+' 响应:'+esc(txt.slice(0,20)||'空')+'</span>';
    })
    .catch(function(e){ el.innerHTML = '<span class="tag ng">'+esc(classifyErr(e))+'</span>'; });
}
function saveNpd(){ store.settings.newPerDay = Math.max(0, +document.getElementById('npd').value||0); var ok=saveSettings(); toast(ok?'已保存':'保存失败：浏览器存储不可用'); }
function useRec(){ document.getElementById('npd').value = recommendQuota(); }
function saveExamDate(){
  var v = (document.getElementById('examDate')||{}).value || '';
  store.settings.examDate = v || '2026-10-24';
  var ok = saveSettings();
  toast(ok? '考试日期已保存：'+examDateText() : '保存失败：浏览器存储不可用');
  vSettings();
}
function applyPageWidth(){
  var v = store.settings.pageWidth || 1200;
  document.documentElement.style.setProperty('--page-max', (v==='full')? 'none' : (parseInt(v,10)||1200)+'px');
}
function onPageWidthSel(sel){
  var inp = document.getElementById('pgwNum');
  if(inp) inp.style.display = (sel.value==='custom')? 'inline-block':'none';
  if(sel.value!=='custom') savePageWidth();
}
function savePageWidth(){
  var sel = (document.getElementById('pgw')||{}).value || '1200';
  var v;
  if(sel==='full') v = 'full';
  else if(sel==='custom') v = Math.max(800, Math.min(2400, +((document.getElementById('pgwNum')||{}).value)||1200));
  else v = +sel || 1200;
  store.settings.pageWidth = v;
  var ok = saveSettings();
  applyPageWidth();
  toast(ok? ('界面宽度已设为 '+(v==='full'?'全宽':v+'px')) : '保存失败：浏览器存储不可用');
  if(currentView==='settings') vSettings();
}

function doImport(){
  var f = document.getElementById('impFile').files[0];
  var msg = document.getElementById('impMsg');
  if(!f){ msg.textContent='请先选择 JSON 文件'; return; }
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var data = JSON.parse(rd.result);
      var nq=0;
      var imp = JSON.parse(localStorage.getItem(LS_IMP)||'{"papers":[],"questions":{}}');
      (data.papers||[]).forEach(function(p){
        var pid = 'P-'+p.year+'-'+p.half+'-'+p.subject;
        if(!DB.papers.find(x=>x.id===pid)) DB.papers.push({id:pid,year:p.year,half:p.half,subject:p.subject,title:p.title||pid,qids:[],cids:[]});
      });
      (data.questions||[]).forEach(function(q){
        var P = data.papers[0];
        var id = 'M-'+P.year+'-'+P.half+'-'+('00'+q.num).slice(-3);
        DB.questions[id] = {id:id, year:P.year, half:P.half, subject:1, num:q.num, type:'choice',
          stem:q.stem||'', options:(q.options||[]).map(function(o){return {key:o.key,text:o.text};}),
          answer:q.answer||null, analysis:q.analysis||null, translation:null, group:null, source:'用户导入'};
        var p = DB.papers.find(x=>x.id===('P-'+P.year+'-'+P.half+'-1'));
        if(p && p.qids.indexOf(id)<0) p.qids.push(id);
        imp.questions[id] = DB.questions[id]; nq++;
      });
      localStorage.setItem(LS_IMP, JSON.stringify(imp));
      DB.papers.forEach(function(p){ p.qids.sort(); });
      CARD_INDEX = null;
      msg.innerHTML = '<span class="tag ok">✓ 导入 '+nq+' 题</span>';
      toast('导入成功');
    }catch(e){ msg.textContent = '导入失败: '+e.message; }
  };
  rd.readAsText(f, 'utf-8');
}
function exportData(){
  store.settings.lastBackupTs = Date.now();
  saveSettings();
  var blob = new Blob([JSON.stringify(store)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '复习进度备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('已导出备份');
}
function importData(inp){
  var f = inp.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(!d.rec) throw new Error('格式不对');
      try{ localStorage.setItem(LS_SNAP, JSON.stringify({ts:Date.now(), store:store})); }catch(e){}
      var set = d.settings; delete d.settings;
      store = d; for(var k in defaultStore()) if(store[k]===undefined) store[k]=defaultStore()[k];
      store.settings = mergeSettings(set || null);
      save(); saveSettings(); toast('进度已恢复'); go('home');
    }catch(e){ toast('恢复失败: '+e.message); }
  };
  rd.readAsText(f,'utf-8');
}
function resetAll(){
  if(!confirm('确定清空所有做题/复习记录与设置? 不可恢复!')) return;
  localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_IMP); localStorage.removeItem(LS_SET);
  location.reload();
}

/* ================= 启动 ================= */
document.addEventListener('click', function(e){
  var t = e.target;
  if(t && t.tagName==='IMG' && t.closest && t.closest('.qtext')) openImgModal(t.src);
});
applyPageWidth();
migrateRecFix();
go('home');
loadBackupHandle();
</script>
